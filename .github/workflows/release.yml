# Release: when a version tag like v0.1.0 is pushed, check the code, build the macOS binaries,
# and publish them as a GitHub Release with a SHA256SUMS file and build-provenance attestations.
#
# To release, with the version bump on main (and `git pull` done):
#     npm version patch            bumps package.json and tags that commit, e.g. v0.1.1
#     git push origin main --follow-tags
#
# If main requires pull requests, bump in a PR instead, then tag AFTER it has merged:
#     npm version patch --no-git-tag-version      (on the PR branch, commit and merge it)
#     git checkout main && git pull
#     git tag v0.1.1 && git push origin v0.1.1
# Tag the commit that is on main. A tag made on the PR branch is refused after a squash
# merge, because the squash rewrites the commit and the tag's commit is then not on main.
#
# A tag with a pre-release part (v0.2.0-rc.1) is published as a pre-release. GitHub's
# "latest release" skips pre-releases, so install an rc by naming it:
#     curl -fsSL .../install.sh | TANGENT_VERSION=v0.2.0-rc.1 sh
#
# Anyone who can push a tag can publish a release, so this workflow refuses tags whose commit
# isn't on main, and tags that don't match the version in package.json.

name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default. The one job asks for exactly what it needs.
permissions: {}

# Pushing two tags quickly must not run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # macOS because the binaries are re-signed with codesign (see scripts/build.ts).
    runs-on: macos-latest
    # A hung build or upload would otherwise hold the runner for GitHub's 6-hour default, and
    # the next tag waits behind it (concurrency above). The whole job normally takes minutes.
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload files
      id-token: write # lets GitHub sign the build provenance
      attestations: write # store the build provenance
    env:
      # The tag, passed in through the environment. Never paste ${{ github.ref_name }} straight
      # into a shell command: tag names are input, and that is how script injection happens.
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Actions are pinned to full commit SHAs, not tags, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, so we can check the tag is on main
          persist-credentials: false

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exactly the Bun the binaries were tested with. Bun's compile output has quirks that
          # change between versions (see userArgs in src/cli.ts), so upgrade it on purpose.
          bun-version: 1.2.21

      - run: bun install --frozen-lockfile

      - name: Tag must match package.json
        run: bun scripts/release.ts check-tag "$TAG"

      # The checks CLAUDE.md asks for before every commit. Nothing is built from code that fails them.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - run: bun run build

      # Run what we are about to publish. The failures this project has already had (a startup
      # crash from a missing module, a broken signature that makes macOS kill the file) all
      # "build fine and die when run". --version needs no terminal, and must print the tag's
      # version. Only the arm64 binary is run: this runner is Apple Silicon and may not have
      # Rosetta, so the x64 binary is NOT tested here.
      - name: Smoke-test the arm64 binary
        run: |
          out="$(dist/tangent-darwin-arm64 --version)"
          [ "$out" = "tangent ${TAG#v}" ] || { echo "unexpected output: $out"; exit 1; }

      - name: Write SHA256SUMS and check it
        working-directory: dist
        run: |
          bun ../scripts/release.ts sums . > SHA256SUMS
          cat SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tangent-darwin-*

      - name: Publish the release
        run: |
          flags=()
          if [ "$(bun scripts/release.ts prerelease "$TAG")" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/tangent-darwin-arm64 \
            dist/tangent-darwin-x64 \
            dist/SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes ${flags[@]+"${flags[@]}"}
